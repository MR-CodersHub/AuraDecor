<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link rel="shortcut icon" href="../favicon.svg">
  <meta name="description" content="Page not found — AuraDecor. Handcrafted slow living heirlooms and artisan crafts.">
  <title>404 — Handcrafted Piece Not Found — AuraDecor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <style>
    /* ===== 404 PAGE (HEADER ONLY — NO NAVBAR, NO FOOTER) ===== */
    .notfound-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }

    /* Top Minimal Brand Header */
    .notfound-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 1rem 0;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      transition: background-color var(--transition-base), border-color var(--transition-base);
    }
    [data-theme="dark"] .notfound-header {
      background-color: rgba(42, 34, 24, 0.95);
    }
    .notfound-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .notfound-header-actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    /* Centered 404 Stage */
    .notfound-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2.5rem, 5vw, 5rem) 1.5rem;
    }
    .notfound-card {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
      padding: clamp(2.5rem, 5vw, 4.2rem) clamp(1.8rem, 4vw, 3.8rem);
      background-color: var(--card-bg, #ffffff);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-2xl, 24px);
      box-shadow: 0 16px 44px rgba(57, 51, 45, 0.08);
      transition: background-color var(--transition-base), border-color var(--transition-base), box-shadow var(--transition-base);
    }
    .notfound-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 6px 16px;
      border-radius: var(--radius-full, 9999px);
      background-color: rgba(185, 104, 78, 0.12);
      color: var(--terracotta);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }
    .notfound-visual {
      font-family: var(--font-serif);
      font-size: clamp(6.5rem, 16vw, 10.5rem);
      line-height: 0.95;
      font-weight: 900;
      color: var(--terracotta);
      letter-spacing: -0.02em;
      margin-bottom: 0.8rem;
      text-shadow: 0 10px 30px rgba(185, 104, 78, 0.22);
    }
    .notfound-card h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      color: var(--text-primary);
      margin-bottom: 1rem;
      line-height: 1.25;
    }
    .notfound-card h1 em {
      font-style: italic;
      color: var(--terracotta);
    }
    .notfound-card p {
      color: var(--text-secondary);
      font-size: 1.05rem;
      line-height: 1.7;
      max-width: 520px;
      margin: 0 auto 2.2rem;
    }
    .notfound-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    @media (max-width: 480px) {
      .notfound-stage {
        padding: 2rem 1rem;
      }
      .notfound-card {
        padding: 2.2rem 1.2rem;
        border-radius: var(--radius-xl, 20px);
      }
      .notfound-actions {
        flex-direction: column;
        width: 100%;
        gap: 0.75rem;
      }
      .notfound-actions .btn {
        width: 100%;
        padding: 12px 14px;
        font-size: 0.78rem;
        letter-spacing: 0.05em;
        box-sizing: border-box;
        white-space: normal;
        text-align: center;
        line-height: 1.35;
      }
    }

    @media (max-width: 360px) {
      .notfound-stage {
        padding: 1.5rem 0.65rem;
      }
      .notfound-card {
        padding: 1.8rem 0.85rem;
        border-radius: var(--radius-lg, 16px);
      }
      .notfound-actions .btn {
        padding: 11px 10px;
        font-size: 0.74rem;
        letter-spacing: 0.03em;
        white-space: normal;
        text-align: center;
        line-height: 1.35;
      }
    }

    [data-theme="dark"] .notfound-card {
      background-color: var(--card-bg);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.42);
    }
  </style>
</head>
<body class="notfound-page">

  <!-- ===== BRAND HEADER (LOGO, TAGLINE, THEME & RTL/LTR TOGGLES) ===== -->
  <header class="notfound-header">
    <div class="container notfound-header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-mark">
          <svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="64" height="64" rx="16" fill="#B9684E"/>
            <path d="M32 10 L35.2 24.5 L46 17 L38.5 27.8 L53 32 L38.5 36.2 L46 47 L35.2 39.5 L32 54 L28.8 39.5 L18 47 L25.5 36.2 L11 32 L25.5 27.8 L18 17 L28.8 24.5 Z" fill="#F8F3E9"/>
            <path d="M32 17 L36.5 27.5 L47 32 L36.5 36.5 L32 47 L27.5 36.5 L17 32 L27.5 27.5 Z" fill="#B79A62"/>
            <circle cx="32" cy="32" r="3.2" fill="#B9684E"/>
          </svg>
        </span>
        <span class="logo-text-group">
          <span class="logo-text">AuraDecor</span>
          <span class="logo-tagline">Crafted with Soul</span>
        </span>
      </a>

      <div class="notfound-header-actions">
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
        <button class="icon-btn text-toggle" id="rtl-toggle" aria-label="Toggle RTL">RTL</button>
      </div>
    </div>
  </header>

  <!-- ===== 404 CONTENT STAGE (NO FOOTER) ===== -->
  <main class="notfound-stage">
    <div class="container">
      <div class="notfound-card reveal">
        <span class="notfound-badge"><i class="fas fa-compass"></i> Page Not Found</span>
        <div class="notfound-visual">404</div>
        <h1>A Missing Fragment in the <em>Craft Mosaic</em></h1>
        <p>Like a piece of handcrafted pottery fired in an unexpected wind, this page has wandered away from the workshop or does not exist.</p>
        <div class="notfound-actions">
          <a href="../index.html" class="btn btn-primary"><i class="fas fa-house"></i> Return to Homepage</a>
          <a href="services.html" class="btn btn-secondary"><i class="fas fa-store"></i> Explore Shop</a>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
</body>
</html>
